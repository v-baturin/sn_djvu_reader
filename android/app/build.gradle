apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.djvureader"
    compileSdk 35

    defaultConfig {
        applicationId "com.djvureader"
        minSdk 27
        targetSdk 29 // Manta's Android 11 storage access for DjVu files in its library folders.
        versionCode 14
        versionName "0.4.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
    sourceSets.main.assets.srcDirs += [file("../../vendor"), file("../../reader")]
    lint {
        disable 'ExpiredTargetSdkVersion'
    }
}
